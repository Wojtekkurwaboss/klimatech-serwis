<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#142f45" />
      <stop offset="55%" stop-color="#1e4a66" />
      <stop offset="100%" stop-color="#2b5c79" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f2994a" stop-opacity="0.30" />
      <stop offset="70%" stop-color="#f2994a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="markFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="ctaFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2b06a" />
      <stop offset="100%" stop-color="#e88a3c" />
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" opacity="0.08" />
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)" />
  <rect width="1280" height="640" fill="url(#dots)" />
  <circle cx="1120" cy="60" r="310" fill="url(#glow)" />

  <!-- Brand mark -->
  <g transform="translate(76,72)">
    <rect width="56" height="56" rx="16" fill="url(#markFill)" stroke="#ffffff" stroke-opacity="0.15" />
    <g transform="translate(13,13)" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round">
      <path d="M15 0v30" />
      <path d="M1.5 7.5l27 15" />
      <path d="M28.5 7.5l-27 15" />
      <path d="M15 0l-4.5 4.5M15 0l4.5 4.5" />
      <path d="M15 30l-4.5-4.5M15 30l4.5 4.5" />
      <path d="M1.5 7.5l1-6M1.5 7.5l6 1" />
      <path d="M28.5 22.5l-1 6M28.5 22.5l-6-1" />
      <path d="M28.5 7.5l-6-1M28.5 7.5l1-6" />
      <path d="M1.5 22.5l6 1M1.5 22.5l-1-6" />
    </g>
    <circle cx="49" cy="4" r="5" fill="#F2994A" />
  </g>
  <text x="148" y="98" font-family="Arial, sans-serif" font-weight="700" font-size="28" fill="#f4f8fb" letter-spacing="0.3">KlimaTech Serwis</text>
  <text x="148" y="120" font-family="Arial, sans-serif" font-weight="500" font-size="12" fill="#f4f8fb" opacity="0.6" letter-spacing="2.5">PANEL KLIENTA &#183; TECHNIKA &#183; W&#321;A&#346;CICIELA</text>

  <!-- Headline -->
  <text x="76" y="290" font-family="Arial, sans-serif" font-weight="700" font-size="58" fill="#f4f8fb">Przestań gubić terminy</text>
  <text x="76" y="352" font-family="Arial, sans-serif" font-weight="700" font-size="58" fill="#f2994a">obowiązkowych przeglądów.</text>

  <foreignObject x="76" y="378" width="700" height="110">
    <p xmlns="http://www.w3.org/1999/xhtml" style="margin:0;font-family:Arial,sans-serif;font-size:20px;line-height:1.5;color:rgba(244,248,251,0.85);">
      Gotowa aplikacja dla firm serwisujących klimatyzację i pompy ciepła — pilnuje przeglądów CRO, zbiera podpisy klienta i pokazuje ryzyko całej firmy jednym rzutem oka.
    </p>
  </foreignObject>

  <!-- Pills -->
  <g transform="translate(76,528)">
    <rect width="228" height="42" rx="21" fill="#ffffff" opacity="0.08" stroke="#ffffff" stroke-opacity="0.14" />
    <circle cx="24" cy="21" r="4" fill="#f2994a" />
    <text x="38" y="26" font-family="Arial, sans-serif" font-size="15" fill="#f4f8fb">2 zaległe przeglądy</text>
  </g>
  <g transform="translate(320,528)">
    <rect width="244" height="42" rx="21" fill="#ffffff" opacity="0.08" stroke="#ffffff" stroke-opacity="0.14" />
    <circle cx="24" cy="21" r="4" fill="#4fae7a" />
    <text x="38" y="26" font-family="Arial, sans-serif" font-size="15" fill="#f4f8fb">Wpisy CRO pod kontrolą</text>
  </g>

  <!-- CTA -->
  <g transform="translate(940,510)">
    <rect width="264" height="60" rx="14" fill="url(#ctaFill)" />
    <text x="132" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#1e2b1a">Zobacz demo &#8594;</text>
  </g>
</svg>
